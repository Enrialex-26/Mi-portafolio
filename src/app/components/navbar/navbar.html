<header class="site-header">
	<nav class="navbar" aria-label="Navegación principal">
		<a class="brand" href="#inicio" (click)="closeMenu()">ENRIQUE LOZANO</a>

		<button
			class="menu-toggle"
			type="button"
			[attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
			aria-controls="primary-navigation"
			[attr.aria-expanded]="menuOpen()"
			(click)="toggleMenu()"
		>
			<span aria-hidden="true"></span>
			<span aria-hidden="true"></span>
			<span aria-hidden="true"></span>
		</button>

		<div id="primary-navigation" class="nav-links" [class.is-open]="menuOpen()">
			<a href="#sobre-mi" (click)="closeMenu()">Sobre mí</a>
			<a href="#experiencia" (click)="closeMenu()">Experiencia</a>
			<a href="#educacion" (click)="closeMenu()">Educación</a>
			<a href="#habilidades" (click)="closeMenu()">Habilidades</a>
			<a href="#proyectos" (click)="closeMenu()">Proyectos</a>
			<a href="#contacto" (click)="closeMenu()">Contacto</a>
			<button class="cv-button" type="button" disabled title="Pendiente de agregar el archivo del CV">
				Descargar CV <span aria-hidden="true">↗</span>
			</button>
		</div>
	</nav>
</header>
